<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>XO Game – Play Game XO, Fun all day!</title>
<meta name="description" content="XO Game – chơi cờ X-O vui cả ngày. Đấu 2 người hoặc đấu máy.">
<meta name="theme-color" content="#0b3fb0">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preload" as="image" href="assets/x.webp">
<link rel="preload" as="image" href="assets/o.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,600;0,800;1,900&display=swap" rel="stylesheet">
<style>
  /* Màu thương hiệu XO Game: xanh neon + vàng cam */
  :root{
    --navy:#08226f; --ink:#0b1c5c; --blue:#0b4fc4; --sky:#2aa6ff; --cyan:#8fe1ff;
    --yellow:#ffd42e; --orange:#f47a1c; --red:#d9390f; --white:#fff;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;min-height:100vh;min-height:100dvh;color:var(--white);
    font-family:'Be Vietnam Pro',system-ui,sans-serif;font-weight:600;
    background:radial-gradient(120% 70% at 50% -5%,#7fd6ff 0%,#2487ea 32%,#0b46b8 66%,#08226f 100%) fixed;
    display:flex;justify-content:center;padding:14px 14px calc(18px + env(safe-area-inset-bottom));overflow-x:hidden}
  /* tia sáng nền kiểu sân khấu */
  body::before{content:"";position:fixed;inset:-50%;z-index:-1;pointer-events:none;
    background:repeating-conic-gradient(from 0deg at 50% 38%,rgba(255,255,255,.07) 0 7deg,transparent 7deg 18deg);
    animation:spin 90s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .app{width:100%;max-width:500px;display:flex;flex-direction:column;gap:10px}

  /* Header: logo + slogan */
  .hero{display:flex;align-items:center;justify-content:center;gap:2px;margin:0 -6px}
  .hero h1{margin:0;flex:0 0 43%;line-height:0}
  .hero .logo{width:100%;height:auto;filter:drop-shadow(0 8px 14px rgba(4,20,80,.45));animation:float 3.6s ease-in-out infinite}
  .hero .slogan{flex:1 1 0;min-width:0;height:auto;filter:drop-shadow(0 6px 10px rgba(4,20,80,.35))}
  @keyframes float{50%{transform:translateY(-6px) rotate(-1.5deg)}}

  /* Bộ chọn chế độ / bàn cờ */
  .settings{display:flex;flex-direction:column;gap:8px}
  .seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(6,24,96,.55);
    border:1.5px solid rgba(143,225,255,.45)}
  .seg button{flex:1;border:0;border-radius:999px;padding:9px 4px;font:inherit;font-size:13px;font-weight:800;
    color:#d6ecff;background:transparent;cursor:pointer;transition:.15s;white-space:nowrap}
  .seg button:hover{background:rgba(255,255,255,.12)}
  .seg button[aria-pressed="true"]{color:var(--ink);background:linear-gradient(#ffe46b,var(--yellow));
    box-shadow:0 2px 0 #c98a00,0 0 14px rgba(255,212,46,.55)}

  /* Bảng điểm */
  .score{display:grid;grid-template-columns:1fr .8fr 1fr;gap:8px}
  .card{background:linear-gradient(#fff,#e3f2ff);color:var(--ink);border-radius:16px;padding:8px 10px;
    display:flex;align-items:center;justify-content:center;gap:8px;min-width:0;
    box-shadow:0 4px 0 #0a2f8f,0 8px 16px rgba(4,20,80,.3);border:2.5px solid transparent;transition:.2s}
  .card img{width:38px;height:38px;object-fit:contain;flex:none}
  .card div{display:flex;flex-direction:column;min-width:0;line-height:1.1}
  .card b{font-size:26px;font-weight:800}
  .card span{font-size:11px;color:#3c57a8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card.draw{flex-direction:column;gap:0;text-align:center;background:linear-gradient(#dcefff,#bfdfff)}
  .card.turn{border-color:var(--yellow);transform:translateY(-3px);
    box-shadow:0 7px 0 #0a2f8f,0 0 0 3px rgba(255,212,46,.35),0 0 22px rgba(255,212,46,.8)}

  .status{align-self:center;display:flex;align-items:center;gap:8px;min-height:38px;padding:6px 18px;
    border-radius:999px;background:rgba(6,24,96,.6);border:1.5px solid rgba(143,225,255,.45);
    font-weight:800;font-size:16px;text-align:center}
  .status img{width:24px;height:24px;object-fit:contain}
  .status.end{color:var(--ink);background:linear-gradient(#ffe46b,var(--yellow));border-color:#fff;
    box-shadow:0 0 22px rgba(255,212,46,.8);animation:bump .45s ease}
  @keyframes bump{0%{transform:scale(.7)}60%{transform:scale(1.1)}100%{transform:scale(1)}}

  /* Bàn cờ */
  .board{display:grid;gap:8px;aspect-ratio:1;width:min(100%,max(260px,calc(100dvh - 430px)));align-self:center;
    padding:10px;border-radius:22px;background:linear-gradient(160deg,#0d3fb5,#071c66);
    box-shadow:0 0 0 3px var(--cyan),0 0 0 8px #0a2f8f,0 0 26px 8px rgba(143,225,255,.45),0 16px 30px rgba(4,20,80,.45)}
  .cell{appearance:none;border:0;padding:0;margin:0;min-width:0;min-height:0;border-radius:14px;cursor:pointer;
    background:linear-gradient(#fff,#d9edff);box-shadow:inset 0 -4px 0 #a9cdf5,inset 0 2px 0 #fff;
    display:flex;align-items:center;justify-content:center;transition:transform .12s,filter .12s;
    -webkit-tap-highlight-color:transparent}
  .cell:not(.filled):hover{filter:brightness(1.06);transform:translateY(-2px)}
  .cell.filled{cursor:default}
  .cell img{width:80%;height:80%;object-fit:contain;pointer-events:none;filter:drop-shadow(0 3px 3px rgba(4,20,80,.3))}
  .cell.pop img{animation:pop .28s cubic-bezier(.3,1.6,.5,1)}
  @keyframes pop{from{transform:scale(.3) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}
  .cell.win{background:linear-gradient(#fff3a6,var(--yellow));box-shadow:inset 0 -4px 0 #e09a00,0 0 18px rgba(255,212,46,.95);
    animation:glow .8s ease-in-out infinite alternate}
  .cell.win img{animation:dance .8s ease-in-out infinite alternate}
  .board.over .cell:not(.win){filter:saturate(.7) brightness(.86)}
  @keyframes glow{to{box-shadow:inset 0 -4px 0 #e09a00,0 0 30px 4px rgba(255,160,30,1)}}
  @keyframes dance{to{transform:scale(1.12) rotate(6deg)}}

  /* Nút bấm */
  .actions{display:flex;gap:10px;margin-top:4px}
  .btn{flex:1;border:0;border-radius:14px;padding:12px 6px;font:inherit;font-weight:800;font-size:14px;cursor:pointer;
    color:var(--ink);background:linear-gradient(#fff,#dcecff);box-shadow:0 4px 0 #9dbdea;transition:.1s}
  .btn.main{flex:1.3;color:#5a1d00;background:linear-gradient(#ffe46b,var(--yellow) 45%,var(--orange));box-shadow:0 4px 0 #b9480a,0 0 18px rgba(255,190,40,.55)}
  .btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #9dbdea}
  .btn.main:active{box-shadow:0 1px 0 #b9480a}
  .btn:disabled{opacity:.45;cursor:default}
  .foot{text-align:center;font-size:11px;color:#bcdcff;opacity:.85}
  :focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

  @media (min-width:560px){ .seg button{font-size:14px} .board{width:min(100%,max(260px,calc(100dvh - 520px)))} }
  @media (prefers-reduced-motion:reduce){ *,*::before{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div class="app">
  <header class="hero">
    <h1><img class="logo" src="assets/logo.webp" width="760" height="600" alt="XO Game"></h1>
    <img class="slogan" src="assets/slogan.webp" width="860" height="352" alt="Play Game XO – Fun all day!">
  </header>

  <div class="settings">
    <div class="seg" id="mode" role="group" aria-label="Chế độ chơi">
      <button data-v="pvp">2 người</button>
      <button data-v="easy">Máy – Dễ</button>
      <button data-v="hard">Máy – Khó</button>
    </div>
    <div class="seg" id="size" role="group" aria-label="Bàn cờ">
      <button data-v="3-3">3×3 · thắng 3</button>
      <button data-v="5-4">5×5 · thắng 4</button>
      <button data-v="7-5">7×7 · thắng 5</button>
    </div>
  </div>

  <div class="score">
    <div class="card" id="cX"><img src="assets/x.webp" alt="X"><div><b id="sX">0</b><span id="nX">X</span></div></div>
    <div class="card draw"><b id="sD">0</b><span>Hòa</span></div>
    <div class="card" id="cO"><img src="assets/o.webp" alt="O"><div><b id="sO">0</b><span id="nO">O</span></div></div>
  </div>

  <div class="status" id="status" aria-live="polite"></div>
  <div class="board" id="board"></div>

  <div class="actions">
    <button class="btn" id="undo">↶ Đi lại</button>
    <button class="btn main" id="restart">Ván mới</button>
    <button class="btn" id="reset">Xóa điểm</button>
  </div>
  <div class="foot">XO Game · Play Game XO, Fun all day!</div>
</div>

<script>
/* =========================================================
   CẤU TRÚC CODE (để phát triển về sau)
   1. CONFIG  – tuỳ chỉnh luật, chế độ, giao diện
   2. Rules   – luật thắng/hòa (dùng chung cho mọi kích thước bàn)
   3. AI      – các "bot" theo cấp độ; thêm bot mới vào AI.bots
   4. Store   – lưu điểm (localStorage, có thể thay bằng server)
   5. Game    – trạng thái ván + lịch sử nước đi
   6. UI      – vẽ bàn cờ, xử lý click
   7. Events  – hook để gắn tính năng mới (âm thanh, hiệu ứng, tracking...)
   ========================================================= */

/* 1. CONFIG */
const CONFIG = {
  players: { X: { name: 'X' }, O: { name: 'O' } },
  botPlays: 'O',           // máy cầm quân nào
  botDelay: 350,           // ms, cho cảm giác "đang suy nghĩ"
  storageKey: 'ttt_score_v1'
};

/* 7. Events – đơn giản: Events.on('win', fn) */
const Events = {
  _h: {},
  on(e, fn){ (this._h[e] ||= []).push(fn); },
  emit(e, d){ (this._h[e] || []).forEach(fn => fn(d)); }
};

/* 2. Rules */
const Rules = {
  // trả về {winner, line} | {draw:true} | null
  check(board, n, k){
    const dirs = [[0,1],[1,0],[1,1],[1,-1]];
    for (let r=0;r<n;r++) for (let c=0;c<n;c++){
      const p = board[r*n+c]; if (!p) continue;
      for (const [dr,dc] of dirs){
        const line=[r*n+c];
        for (let i=1;i<k;i++){
          const rr=r+dr*i, cc=c+dc*i;
          if (rr<0||rr>=n||cc<0||cc>=n||board[rr*n+cc]!==p) break;
          line.push(rr*n+cc);
        }
        if (line.length===k) return { winner:p, line };
      }
    }
    return board.every(Boolean) ? { draw:true } : null;
  },
  empty(board){ return board.map((v,i)=>v?null:i).filter(i=>i!==null); }
};

/* 3. AI */
const AI = {
  bots: {
    easy(g){ // 70% ngẫu nhiên, 30% chơi tốt
      return Math.random()<0.7 ? AI.random(g) : AI.bots.hard(g);
    },
    hard(g){
      return g.n===3 ? AI.minimax(g) : AI.heuristic(g);
    }
  },
  random(g){ const e=Rules.empty(g.board); return e[Math.floor(Math.random()*e.length)]; },

  // Minimax đầy đủ cho bàn 3x3 – bất bại
  minimax(g){
    const me=g.turn, op=me==='X'?'O':'X', b=[...g.board];
    const score=(depth)=>{
      const r=Rules.check(b,3,3);
      if (r?.winner===me) return 10-depth;
      if (r?.winner===op) return depth-10;
      if (r?.draw) return 0;
      return null;
    };
    const search=(isMe,depth,a,bt)=>{
      const s=score(depth); if (s!==null) return s;
      let best=isMe?-Infinity:Infinity;
      for (const i of Rules.empty(b)){
        b[i]=isMe?me:op;
        const v=search(!isMe,depth+1,a,bt);
        b[i]=null;
        if (isMe){ best=Math.max(best,v); a=Math.max(a,v); }
        else { best=Math.min(best,v); bt=Math.min(bt,v); }
        if (bt<=a) break;
      }
      return best;
    };
    let bestMove=null, bestVal=-Infinity;
    for (const i of Rules.empty(b)){
      b[i]=me; const v=search(false,1,-Infinity,Infinity); b[i]=null;
      if (v>bestVal){ bestVal=v; bestMove=i; }
    }
    return bestMove;
  },

  // Chấm điểm theo chuỗi cho bàn lớn (5x5, 7x7...)
  heuristic(g){
    const {n,k,board}=g, me=g.turn, op=me==='X'?'O':'X';
    const dirs=[[0,1],[1,0],[1,1],[1,-1]];
    const lineVal=(i,p)=>{
      const r=Math.floor(i/n), c=i%n; let total=0;
      for (const [dr,dc] of dirs){
        let cnt=1, open=0;
        for (const s of [1,-1]){
          let rr=r+dr*s, cc=c+dc*s;
          while(rr>=0&&rr<n&&cc>=0&&cc<n&&board[rr*n+cc]===p){cnt++;rr+=dr*s;cc+=dc*s;}
          if (rr>=0&&rr<n&&cc>=0&&cc<n&&!board[rr*n+cc]) open++;
        }
        if (cnt>=k) total+=1e6;
        else total+=Math.pow(10,cnt)*(open||0.1);
      }
      return total;
    };
    let best=null, bestV=-1;
    for (const i of Rules.empty(board)){
      const center=n/2-Math.abs(Math.floor(i/n)-(n-1)/2)-Math.abs(i%n-(n-1)/2)*0.5;
      const v=lineVal(i,me)*1.1+lineVal(i,op)+center;
      if (v>bestV){ bestV=v; best=i; }
    }
    return best;
  }
};

/* 4. Store */
const Store = {
  load(){ try{ return JSON.parse(localStorage.getItem(CONFIG.storageKey))||{X:0,O:0,D:0}; }catch{ return {X:0,O:0,D:0}; } },
  save(s){ try{ localStorage.setItem(CONFIG.storageKey, JSON.stringify(s)); }catch{} }
};

/* 5. Game */
const Game = {
  n:3, k:3, mode:'hard', board:[], turn:'X', history:[], over:false, score:Store.load(), starter:'X',
  start(){
    this.board=Array(this.n*this.n).fill(null);
    this.turn=this.starter; this.history=[]; this.over=false; this.result=null;
    UI.render(); Events.emit('start', this);
    this.maybeBot();
  },
  isBotTurn(){ return this.mode!=='pvp' && this.turn===CONFIG.botPlays && !this.over; },
  play(i){
    if (this.over || this.board[i]) return;
    this.board[i]=this.turn; this.history.push(i);
    Events.emit('move', {index:i, player:this.turn});
    const r=Rules.check(this.board,this.n,this.k);
    if (r){
      this.over=true; this.result=r;
      if (r.winner) this.score[r.winner]++; else this.score.D++;
      Store.save(this.score);
      this.starter = this.starter==='X'?'O':'X'; // đổi người đi trước ván sau
      Events.emit(r.winner?'win':'draw', r);
    } else this.turn=this.turn==='X'?'O':'X';
    UI.render(i);
    this.maybeBot();
  },
  maybeBot(){
    if (!this.isBotTurn()) return;
    UI.lock(true);
    setTimeout(()=>{ UI.lock(false); this.play(AI.bots[this.mode](this)); }, CONFIG.botDelay);
  },
  undo(){
    if (this.over || !this.history.length) return;
    const steps = this.mode==='pvp' ? 1 : (this.turn===CONFIG.botPlays?1:2);
    for (let s=0;s<steps && this.history.length;s++){
      this.board[this.history.pop()]=null;
      this.turn=this.turn==='X'?'O':'X';
    }
    UI.render();
    this.maybeBot();
  }
};

/* 6. UI */
const $=id=>document.getElementById(id);
const UI = {
  locked:false,
  lock(v){ this.locked=v; },
  PIECE: { X:'assets/x.webp', O:'assets/o.webp' },
  render(last){
    const {n,board,result}=Game, el=$('board');
    el.style.gridTemplate=`repeat(${n},minmax(0,1fr)) / repeat(${n},minmax(0,1fr))`;
    el.style.gap = n>5?'4px':n>3?'6px':'8px';
    el.style.padding = n>5?'7px':'10px';
    el.classList.toggle('over', !!result);
    el.innerHTML='';
    board.forEach((v,i)=>{
      const c=document.createElement('button');
      c.type='button';
      c.className='cell'+(v?` filled ${v}`:'')+(result?.line?.includes(i)?' win':'')+(i===last?' pop':'');
      c.style.borderRadius = n>5?'8px':n>3?'10px':'14px';
      c.setAttribute('aria-label', `Ô ${Math.floor(i/n)+1}-${i%n+1}${v?': '+v:''}`);
      if (v) c.innerHTML=`<img src="${this.PIECE[v]}" alt="${v}">`;
      c.onclick=()=>{ if(!UI.locked && !Game.isBotTurn()) Game.play(i); };
      el.appendChild(c);
    });
    const names = this.names(), icon = p => `<img src="${this.PIECE[p]}" alt="${p}">`;
    $('nX').textContent=names.X; $('nO').textContent=names.O;
    $('sX').textContent=Game.score.X; $('sO').textContent=Game.score.O; $('sD').textContent=Game.score.D;
    $('cX').classList.toggle('turn', !result && Game.turn==='X');
    $('cO').classList.toggle('turn', !result && Game.turn==='O');
    const st=$('status');
    st.classList.toggle('end', !!result);
    st.innerHTML = result?.winner ? `🎉 ${icon(result.winner)} ${names[result.winner]} thắng!`
      : result?.draw ? '🤝 Hòa rồi!'
      : `Lượt của ${icon(Game.turn)} ${names[Game.turn]}`;
    $('undo').disabled = Game.over || !Game.history.length;
    this.seg('mode', Game.mode); this.seg('size', `${Game.n}-${Game.k}`);
  },
  seg(id, val){ $(id).querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.v===val)); },
  names(){
    if (Game.mode==='pvp') return {X:'Người X', O:'Người O'};
    const bot=CONFIG.botPlays, me=bot==='X'?'O':'X';
    return {[me]:'Bạn', [bot]:'Máy'};
  }
};

/* Wiring */
$('mode').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; Game.mode=b.dataset.v; Game.start(); };
$('size').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; [Game.n,Game.k]=b.dataset.v.split('-').map(Number); Game.start(); };
$('restart').onclick=()=>Game.start();
$('undo').onclick=()=>Game.undo();
$('reset').onclick=()=>{ Game.score={X:0,O:0,D:0}; Store.save(Game.score); UI.render(); };

// Ví dụ hook mở rộng: Events.on('win', r => console.log('Winner', r.winner));
Game.start();
</script>
</body>
</html>
