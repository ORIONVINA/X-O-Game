<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tic Tac Toe – Xo Caro</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1226; --panel:#181c3a; --line:#2a2f5c; --text:#eef0ff; --muted:#9aa0c8;
    --x:#ff5c7a; --o:#3ad1ff; --win:#ffd34d; --accent:#7c5cff;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0%,#1d2150,var(--bg) 60%);
    color:var(--text);font-family:'Be Vietnam Pro',system-ui,sans-serif;display:flex;justify-content:center;padding:24px 14px}
  .app{width:100%;max-width:520px;display:flex;flex-direction:column;gap:16px}
  h1{margin:0;font-size:28px;font-weight:800;letter-spacing:.5px;text-align:center}
  h1 .x{color:var(--x)} h1 .o{color:var(--o)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
  .settings{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
  select{background:#0f1330;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px;font:inherit}
  .score{display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center}
  .score b{display:block;font-size:26px}
  .score .sx b{color:var(--x)} .score .so b{color:var(--o)}
  .score span{font-size:12px;color:var(--muted)}
  .status{text-align:center;font-weight:600;font-size:18px;min-height:26px}
  .board{display:grid;gap:8px;aspect-ratio:1;width:100%}
  .cell{background:#0f1330;border:1px solid var(--line);border-radius:12px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-weight:800;transition:.15s;user-select:none}
  .cell:hover:not(.filled){background:#1a1f48}
  .cell.X{color:var(--x)} .cell.O{color:var(--o)}
  .cell.win{background:rgba(255,211,77,.18);border-color:var(--win);color:var(--win)}
  .cell.pop{animation:pop .2s ease}
  @keyframes pop{from{transform:scale(.6);opacity:.3}to{transform:scale(1);opacity:1}}
  .actions{display:flex;gap:10px}
  button{flex:1;border:0;border-radius:12px;padding:12px;font:inherit;font-weight:600;cursor:pointer;color:#fff;background:var(--accent)}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
  button:disabled{opacity:.4;cursor:default}
  .foot{text-align:center;font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <h1><span class="x">X</span> Tic Tac Toe <span class="o">O</span></h1>

  <div class="panel settings">
    <label>Chế độ
      <select id="mode">
        <option value="pvp">2 người chơi</option>
        <option value="easy">Đấu máy – Dễ</option>
        <option value="hard" selected>Đấu máy – Khó</option>
      </select>
    </label>
    <label>Bàn cờ
      <select id="size">
        <option value="3-3" selected>3 × 3 (thắng 3)</option>
        <option value="5-4">5 × 5 (thắng 4)</option>
        <option value="7-5">7 × 7 (thắng 5)</option>
      </select>
    </label>
  </div>

  <div class="panel score">
    <div class="sx"><b id="sX">0</b><span id="nX">X</span></div>
    <div><b id="sD">0</b><span>Hòa</span></div>
    <div class="so"><b id="sO">0</b><span id="nO">O</span></div>
  </div>

  <div class="status" id="status"></div>
  <div class="board" id="board"></div>

  <div class="actions">
    <button class="ghost" id="undo">↶ Đi lại</button>
    <button id="restart">Ván mới</button>
    <button class="ghost" id="reset">Xóa điểm</button>
  </div>
  <div class="foot">v1.0 · Xo Caro</div>
</div>

<script>
/* =========================================================
   CẤU TRÚC CODE (để phát triển về sau)
   1. CONFIG  – tuỳ chỉnh luật, chế độ, giao diện
   2. Rules   – luật thắng/hòa (dùng chung cho mọi kích thước bàn)
   3. AI      – các "bot" theo cấp độ; thêm bot mới vào AI.bots
   4. Store   – lưu điểm (localStorage, có thể thay bằng server)
   5. Game    – trạng thái ván + lịch sử nước đi
   6. UI      – vẽ bàn cờ, xử lý click
   7. Events  – hook để gắn tính năng mới (âm thanh, hiệu ứng, tracking...)
   ========================================================= */

/* 1. CONFIG */
const CONFIG = {
  players: { X: { name: 'X' }, O: { name: 'O' } },
  botPlays: 'O',           // máy cầm quân nào
  botDelay: 350,           // ms, cho cảm giác "đang suy nghĩ"
  storageKey: 'ttt_score_v1'
};

/* 7. Events – đơn giản: Events.on('win', fn) */
const Events = {
  _h: {},
  on(e, fn){ (this._h[e] ||= []).push(fn); },
  emit(e, d){ (this._h[e] || []).forEach(fn => fn(d)); }
};

/* 2. Rules */
const Rules = {
  // trả về {winner, line} | {draw:true} | null
  check(board, n, k){
    const dirs = [[0,1],[1,0],[1,1],[1,-1]];
    for (let r=0;r<n;r++) for (let c=0;c<n;c++){
      const p = board[r*n+c]; if (!p) continue;
      for (const [dr,dc] of dirs){
        const line=[r*n+c];
        for (let i=1;i<k;i++){
          const rr=r+dr*i, cc=c+dc*i;
          if (rr<0||rr>=n||cc<0||cc>=n||board[rr*n+cc]!==p) break;
          line.push(rr*n+cc);
        }
        if (line.length===k) return { winner:p, line };
      }
    }
    return board.every(Boolean) ? { draw:true } : null;
  },
  empty(board){ return board.map((v,i)=>v?null:i).filter(i=>i!==null); }
};

/* 3. AI */
const AI = {
  bots: {
    easy(g){ // 70% ngẫu nhiên, 30% chơi tốt
      return Math.random()<0.7 ? AI.random(g) : AI.bots.hard(g);
    },
    hard(g){
      return g.n===3 ? AI.minimax(g) : AI.heuristic(g);
    }
  },
  random(g){ const e=Rules.empty(g.board); return e[Math.floor(Math.random()*e.length)]; },

  // Minimax đầy đủ cho bàn 3x3 – bất bại
  minimax(g){
    const me=g.turn, op=me==='X'?'O':'X', b=[...g.board];
    const score=(depth)=>{
      const r=Rules.check(b,3,3);
      if (r?.winner===me) return 10-depth;
      if (r?.winner===op) return depth-10;
      if (r?.draw) return 0;
      return null;
    };
    const search=(isMe,depth,a,bt)=>{
      const s=score(depth); if (s!==null) return s;
      let best=isMe?-Infinity:Infinity;
      for (const i of Rules.empty(b)){
        b[i]=isMe?me:op;
        const v=search(!isMe,depth+1,a,bt);
        b[i]=null;
        if (isMe){ best=Math.max(best,v); a=Math.max(a,v); }
        else { best=Math.min(best,v); bt=Math.min(bt,v); }
        if (bt<=a) break;
      }
      return best;
    };
    let bestMove=null, bestVal=-Infinity;
    for (const i of Rules.empty(b)){
      b[i]=me; const v=search(false,1,-Infinity,Infinity); b[i]=null;
      if (v>bestVal){ bestVal=v; bestMove=i; }
    }
    return bestMove;
  },

  // Chấm điểm theo chuỗi cho bàn lớn (5x5, 7x7...)
  heuristic(g){
    const {n,k,board}=g, me=g.turn, op=me==='X'?'O':'X';
    const dirs=[[0,1],[1,0],[1,1],[1,-1]];
    const lineVal=(i,p)=>{
      const r=Math.floor(i/n), c=i%n; let total=0;
      for (const [dr,dc] of dirs){
        let cnt=1, open=0;
        for (const s of [1,-1]){
          let rr=r+dr*s, cc=c+dc*s;
          while(rr>=0&&rr<n&&cc>=0&&cc<n&&board[rr*n+cc]===p){cnt++;rr+=dr*s;cc+=dc*s;}
          if (rr>=0&&rr<n&&cc>=0&&cc<n&&!board[rr*n+cc]) open++;
        }
        if (cnt>=k) total+=1e6;
        else total+=Math.pow(10,cnt)*(open||0.1);
      }
      return total;
    };
    let best=null, bestV=-1;
    for (const i of Rules.empty(board)){
      const center=n/2-Math.abs(Math.floor(i/n)-(n-1)/2)-Math.abs(i%n-(n-1)/2)*0.5;
      const v=lineVal(i,me)*1.1+lineVal(i,op)+center;
      if (v>bestV){ bestV=v; best=i; }
    }
    return best;
  }
};

/* 4. Store */
const Store = {
  load(){ try{ return JSON.parse(localStorage.getItem(CONFIG.storageKey))||{X:0,O:0,D:0}; }catch{ return {X:0,O:0,D:0}; } },
  save(s){ try{ localStorage.setItem(CONFIG.storageKey, JSON.stringify(s)); }catch{} }
};

/* 5. Game */
const Game = {
  n:3, k:3, mode:'hard', board:[], turn:'X', history:[], over:false, score:Store.load(), starter:'X',
  start(){
    this.board=Array(this.n*this.n).fill(null);
    this.turn=this.starter; this.history=[]; this.over=false; this.result=null;
    UI.render(); Events.emit('start', this);
    this.maybeBot();
  },
  isBotTurn(){ return this.mode!=='pvp' && this.turn===CONFIG.botPlays && !this.over; },
  play(i){
    if (this.over || this.board[i]) return;
    this.board[i]=this.turn; this.history.push(i);
    Events.emit('move', {index:i, player:this.turn});
    const r=Rules.check(this.board,this.n,this.k);
    if (r){
      this.over=true; this.result=r;
      if (r.winner) this.score[r.winner]++; else this.score.D++;
      Store.save(this.score);
      this.starter = this.starter==='X'?'O':'X'; // đổi người đi trước ván sau
      Events.emit(r.winner?'win':'draw', r);
    } else this.turn=this.turn==='X'?'O':'X';
    UI.render(i);
    this.maybeBot();
  },
  maybeBot(){
    if (!this.isBotTurn()) return;
    UI.lock(true);
    setTimeout(()=>{ UI.lock(false); this.play(AI.bots[this.mode](this)); }, CONFIG.botDelay);
  },
  undo(){
    if (this.over || !this.history.length) return;
    const steps = this.mode==='pvp' ? 1 : (this.turn===CONFIG.botPlays?1:2);
    for (let s=0;s<steps && this.history.length;s++){
      this.board[this.history.pop()]=null;
      this.turn=this.turn==='X'?'O':'X';
    }
    UI.render();
    this.maybeBot();
  }
};

/* 6. UI */
const $=id=>document.getElementById(id);
const UI = {
  locked:false,
  lock(v){ this.locked=v; },
  render(last){
    const {n,board,result}=Game, el=$('board');
    el.style.gridTemplateColumns=`repeat(${n},1fr)`;
    el.style.gap = n>5?'5px':'8px';
    const fs = n===3?'64px':n===5?'34px':'24px';
    el.innerHTML='';
    board.forEach((v,i)=>{
      const c=document.createElement('div');
      c.className='cell'+(v?` filled ${v}`:'')+(result?.line?.includes(i)?' win':'')+(i===last?' pop':'');
      c.style.fontSize=fs; c.textContent=v||'';
      c.onclick=()=>{ if(!UI.locked && !Game.isBotTurn()) Game.play(i); };
      el.appendChild(c);
    });
    const names = this.names();
    $('nX').textContent=names.X; $('nO').textContent=names.O;
    $('sX').textContent=Game.score.X; $('sO').textContent=Game.score.O; $('sD').textContent=Game.score.D;
    $('status').innerHTML = result?.winner ? `🎉 ${names[result.winner]} thắng!`
      : result?.draw ? '🤝 Hòa rồi!'
      : `Lượt của <span style="color:var(--${Game.turn.toLowerCase()})">${names[Game.turn]}</span>`;
    $('undo').disabled = Game.over || !Game.history.length;
  },
  names(){
    if (Game.mode==='pvp') return {X:'Người chơi X', O:'Người chơi O'};
    const bot=CONFIG.botPlays, me=bot==='X'?'O':'X';
    return {[me]:'Bạn ('+me+')', [bot]:'Máy ('+bot+')'};
  }
};

/* Wiring */
$('mode').onchange=e=>{ Game.mode=e.target.value; Game.start(); };
$('size').onchange=e=>{ const [n,k]=e.target.value.split('-').map(Number); Game.n=n; Game.k=k; Game.start(); };
$('restart').onclick=()=>Game.start();
$('undo').onclick=()=>Game.undo();
$('reset').onclick=()=>{ Game.score={X:0,O:0,D:0}; Store.save(Game.score); UI.render(); };

// Ví dụ hook mở rộng: Events.on('win', r => console.log('Winner', r.winner));
Game.start();
</script>
</body>
</html>
